    <script>
      (function () {
        var ua = navigator.userAgent || "";
        var isBot =

        window.__clarityLoaded = true;

        if (window.__IS_BOT__ || window.__adsLoaded) return;

        document.head.appendChild(s);
      }

      function applyConsent(value){
        var accepted = value === 'accepted';
        gtag('consent', 'update', {
          ad_storage: accepted ? 'granted' : 'denied',
          analytics_storage: accepted ? 'granted' : 'denied',
          ad_user_data: accepted ? 'granted' : 'denied',
          ad_personalization: accepted ? 'granted' : 'denied'
        });
        if (accepted) {
          loadAnalytics();
          loadClarity();
          loadAds();
        }
      }

      window.__bnOnConsent = applyConsent;
      // Backward-compatible hook used by older cached chunks.
      window.__bnLoadThirdParties = function(){ applyConsent('accepted'); };

      function getStoredConsent(){
        try { return localStorage.getItem('bn-cookie-consent'); }
        catch (e) { return null; }
      }

      function scheduleAcceptedThirdParties(){
        if (getStoredConsent() !== 'accepted' || window.__IS_BOT__) return;
        var fired = false;
        function run(){
          if (fired) return;
          fired = true;
          applyConsent('accepted');

        ['pointerdown','keydown','scroll','touchstart'].forEach(function(e){
          window.addEventListener(e, run, { once: true, passive: true });
        });
        window.addEventListener('load', function(){
          if ('requestIdleCallback' in window) {
            window.requestIdleCallback(run, { timeout: 4500 });
          } else {
            setTimeout(run, 3500);
          }
        }, { once: true });
      }

      // Persist a previous rejection as denied without loading any vendor script.
      if (getStoredConsent() === 'rejected') applyConsent('rejected');
      scheduleAcceptedThirdParties();
