name: Indexing Monitor

on:
  schedule:
    # Daily at 06:00 UTC (~11:30 IST). Adjust cron for a different cadence (12–24h window).
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Reconcile production sitemaps
        env:
          SITEMAP_MIN_BOOKS: "50"
        run: npm run check:sitemap:prod

      - name: Run indexing monitor (SAMPLE=all)
        env:
          SAMPLE: all
        run: npx tsx scripts/monitor-indexing.ts

      - name: Verify image sitemap URLs
        if: always()
        run: npx tsx scripts/check-image-sitemap.ts

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: indexing-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
