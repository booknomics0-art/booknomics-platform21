name: Indexing Monitor

on:
  schedule:
    # Daily at 06:00 UTC (~11:30 IST). Adjust cron for a different cadence (12–24h window).
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Reconcile production sitemaps
        env:
          SITEMAP_MIN_BOOKS: "50"
        run: npm run check:sitemap:prod

      - name: Run indexing monitor (SAMPLE=all)
        env:
          SAMPLE: all
        run: npx tsx scripts/monitor-indexing.ts

      - name: Verify image sitemap URLs
        if: always()
        run: npx tsx scripts/check-image-sitemap.ts

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: indexing-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
