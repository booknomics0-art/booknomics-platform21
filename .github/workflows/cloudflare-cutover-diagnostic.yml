name: Cloudflare Cutover Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-full-migration

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cloudflare-cutover-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: booknomics.com
      WORKER_NAME: booknomics
    steps:
      - uses: actions/checkout@v7
      - name: Temporarily attach routes, probe every cutover endpoint, always rollback
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          ZONES=$(curl --fail --silent --show-error "${AUTH[@]}" "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}&status=active")
          ZONE_ID=$(node -e 'const d=JSON.parse(process.argv[1]); process.stdout.write((d.result&&d.result[0]&&d.result[0].id)||"")' "$ZONES")
          test -n "$ZONE_ID"
          : > /tmp/created-route-ids

          cleanup() {
            echo '=== ALWAYS ROLLBACK DIAGNOSTIC ROUTES ==='
            if [[ -f /tmp/created-route-ids ]]; then
              while IFS= read -r id; do
                [[ -n "$id" ]] || continue
                curl --silent --show-error -X DELETE "${AUTH[@]}" \
                  "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes/${id}" >/dev/null || true
                echo "Removed diagnostic route ${id}"
              done < /tmp/created-route-ids
            fi
          }
          trap cleanup EXIT

          ROUTES=$(curl --fail --silent --show-error "${AUTH[@]}" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes")
          node - "$ROUTES" <<'NODE'
          const d=JSON.parse(process.argv[2]);
          const conflicts=(d.result||[]).filter(r => ['booknomics.com/*','www.booknomics.com/*'].includes(r.pattern));
          if (conflicts.length) { console.error('Diagnostic requires clean cutover routes:', conflicts); process.exit(1); }
          NODE

          for pattern in 'booknomics.com/*' 'www.booknomics.com/*'; do
            BODY=$(node -e 'process.stdout.write(JSON.stringify({pattern:process.argv[1],script:"booknomics"}))' "$pattern")
            CODE=$(curl --silent --show-error -o /tmp/create.json -w '%{http_code}' -X POST "${AUTH[@]}" --data "$BODY" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" || true)
            echo "Route create ${pattern}: HTTP ${CODE}"
            cat /tmp/create.json
            [[ "$CODE" -ge 200 && "$CODE" -lt 300 ]]
            ID=$(node -e 'const d=require("/tmp/create.json"); process.stdout.write(d.result?.id||"")')
            test -n "$ID"
            echo "$ID" >> /tmp/created-route-ids
          done

          sleep 8

          probe() {
            NAME="$1"; URL="$2"; FOLLOW="${3:-0}"
            BODY="/tmp/${NAME}.body"; HEAD="/tmp/${NAME}.headers"
            if [[ "$FOLLOW" == "1" ]]; then
              CODE=$(curl --silent --show-error -L --max-redirs 3 -D "$HEAD" -o "$BODY" -w '%{http_code}' "$URL" || true)
            else
              CODE=$(curl --silent --show-error --max-redirs 0 -D "$HEAD" -o "$BODY" -w '%{http_code}' "$URL" || true)
            fi
            echo "=== ${NAME} ==="
            echo "URL: ${URL}"
            echo "HTTP: ${CODE}"
            echo '-- headers --'
            sed -n '1,35p' "$HEAD" || true
            echo '-- body (first 800 bytes) --'
            head -c 800 "$BODY" || true
            echo
          }

          probe apex 'https://booknomics.com/'
          probe home 'https://www.booknomics.com/'
          probe health 'https://www.booknomics.com/api/health'
          probe catalog 'https://www.booknomics.com/api/catalog/books?limit=1'
          probe session 'https://www.booknomics.com/api/auth/session'
          probe oauthmeta 'https://www.booknomics.com/.well-known/oauth-authorization-server'
          probe googlestart 'https://www.booknomics.com/api/auth/google/start?return_to=%2F'
          probe browse 'https://www.booknomics.com/browse'
          probe hindi 'https://www.booknomics.com/hindi'

          echo '=== ROUTES WHILE DIAGNOSTIC ACTIVE ==='
          curl --fail --silent --show-error "${AUTH[@]}" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.stringify(JSON.parse(s).result,null,2)))'
