name: Upload Hindi SVG mind maps to Supabase

on:
  workflow_dispatch:
  push:
    branches:
      - arena/7ad1337e-booknomics-platform21
    paths:
      - .github/workflows/upload-hindi-svg-mindmaps.yml
      - tools/mindmap-engine/render_svg.py
      - tools/mindmap-engine/generate_svg.py
      - tools/mindmap-engine/upload_svg_supabase.py

permissions:
  contents: read

concurrency:
  group: upload-hindi-svg-mindmaps
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: https://pbkfewrtdgiagytmcigb.supabase.co
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve Supabase service key
        env:
          K1: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          K2: ${{ secrets.SUPABASE_SECRET_KEY }}
          K3: ${{ secrets.SUPABASE_SERVICE_KEY }}
          K4: ${{ secrets.SERVICE_ROLE_KEY }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          KEY="${K1:-${K2:-${K3:-$K4}}}"
          if [ -z "$KEY" ] && [ -n "$ACCESS_TOKEN" ]; then
            KEY=$(curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/pbkfewrtdgiagytmcigb/api-keys?reveal=true" \
              | python3 -c 'import json,sys; a=json.load(sys.stdin); k=next((x for x in a if x.get("name")=="service_role" or x.get("type")=="secret"), None); sys.stdout.write((k or {}).get("api_key") or "")') || KEY=""
          fi
          if [ -z "$KEY" ]; then
            echo "::error::No Supabase service-role/secret key available"
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Validate SVG scripts
        run: python -m py_compile render_svg.py generate_svg.py upload_svg_supabase.py upload_supabase.py content.py
        working-directory: tools/mindmap-engine

      - name: Fetch exact published Hindi books
        shell: bash
        run: |
          mkdir -p out
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          fields = ",".join([
              "id", "slug", "title", "author", "category", "tagline", "overview",
              "key_ideas", "daily_application", "action_system", "real_life_example", "language"
          ])
          rows = []
          start = 0
          page = 500
          while True:
              query = urllib.parse.urlencode({
                  "select": fields,
                  "language": "eq.hi",
                  "status": "eq.published",
                  "is_draft": "eq.false",
                  "order": "slug.asc",
              })
              req = urllib.request.Request(
                  f"{base}/rest/v1/books?{query}",
                  headers={
                      "apikey": key,
                      "Authorization": f"Bearer {key}",
                      "Range": f"{start}-{start + page - 1}",
                      "Prefer": "count=exact",
                  },
              )
              with urllib.request.urlopen(req, timeout=120) as resp:
                  batch = json.loads(resp.read().decode("utf-8") or "[]")
              rows.extend(batch)
              if len(batch) < page:
                  break
              start += page
          if not rows:
              raise SystemExit("No published Hindi books returned")
          Path("out/live-hindi-books.json").write_text(json.dumps(rows, ensure_ascii=False), encoding="utf-8")
          print(f"Fetched {len(rows)} published Hindi books")
          PY

      - name: Smoke render 5 localized Hindi SVG maps
        run: python generate_svg.py --lang hi --json ../../out/live-hindi-books.json --out ../../out/svg-hi-smoke --limit 5
        working-directory: tools/mindmap-engine

      - name: Verify Devanagari labels are present
        shell: bash
        run: |
          grep -R -q "एक नज़र में पूरी किताब" out/svg-hi-smoke
          grep -R -q "यह क्यों महत्वपूर्ण है" out/svg-hi-smoke
          grep -R -q "5 मुख्य सीखें" out/svg-hi-smoke

      - name: Render all Hindi SVG maps
        run: python generate_svg.py --lang hi --json ../../out/live-hindi-books.json --out ../../out/mindmaps-hi-svg
        working-directory: tools/mindmap-engine

      - name: Enforce storage-size and count guards
        shell: bash
        run: |
          bytes=$(du -sb out/mindmaps-hi-svg | cut -f1)
          count=$(find out/mindmaps-hi-svg -maxdepth 1 -name '*.svg' | wc -l)
          echo "Rendered $count Hindi SVGs using $bytes bytes"
          if [ "$count" -lt 1500 ]; then
            echo "::error::Expected at least 1500 Hindi SVGs, got $count"
            exit 1
          fi
          if [ "$bytes" -gt 52428800 ]; then
            echo "::error::Hindi SVG batch is above the 50 MB safety ceiling; refusing upload"
            exit 1
          fi

      - name: Upload only missing Hindi mindmaps
        run: python upload_svg_supabase.py --lang hi --dir ../../out/mindmaps-hi-svg --workers 8
        working-directory: tools/mindmap-engine
