name: Cloudflare Worker Secret Audit

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-full-migration

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cloudflare-secret-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production Worker secret names
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Cloudflare credentials missing"
            exit 1
          fi
          npx --yes wrangler@4.136.3 secret list --json > worker-secret-names.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('worker-secret-names.json','utf8'));
          const names = Array.isArray(data) ? data.map(x => x.name || x) : [];
          console.log('Worker secret names:', names.sort().join(', ') || '(none)');
          for (const required of ['GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET']) {
            console.log(`${required}: ${names.includes(required) ? 'present' : 'missing'}`);
          }
          NODE
