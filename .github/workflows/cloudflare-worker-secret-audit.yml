name: Cloudflare Worker Secret Audit

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-full-migration

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cloudflare-secret-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production Worker secret names
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Cloudflare credentials missing"
            exit 1
          fi
          npx --yes wrangler@4.136.3 secret list > worker-secret-names.txt
          cat worker-secret-names.txt
          echo "--- required secret presence ---"
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            if grep -q "$name" worker-secret-names.txt; then
              echo "$name: present"
            else
              echo "$name: missing"
            fi
          done
