name: One-time canonical internal link cleanup

on:
  push:
    branches:
      - fix/google-ranking-render-stability-20261008

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/google-ranking-render-stability-20261008
          fetch-depth: 0

      - name: Apply canonical link patch
        run: node scripts/fix-canonical-links-once.cjs

      - name: Remove one-time files and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-canonical-internal-links-once.yml scripts/fix-canonical-links-once.cjs
          git config user.name 'booknomics-seo-bot'
          git config user.email 'booknomics0@gmail.com'
          git add src/pages/Browse.tsx src/pages/Hindi.tsx src/pages/English.tsx src/pages/BookDetail.tsx .github/workflows/fix-canonical-internal-links-once.yml scripts/fix-canonical-links-once.cjs
          git commit -m 'Point public internal links at canonical book URLs'
          git push origin HEAD:fix/google-ranking-render-stability-20261008
