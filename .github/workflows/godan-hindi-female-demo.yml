name: Generate Godan Hindi Female Demo

on:
  push:
    branches:
      - feature/local-audio-engine
    paths:
      - 'tools/audio-engine/demo/**'
      - '.github/workflows/godan-hindi-female-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TTS dependency
        run: python -m pip install --upgrade edge-tts
      - name: Verify ffmpeg
        run: ffmpeg -version | head -1
      - name: Generate Hindi female MP3
        run: python tools/audio-engine/demo/generate_godan_edge.py
      - name: Show duration
        run: cat tools/audio-engine/demo/godan_duration.txt
      - name: Upload demo audio
        uses: actions/upload-artifact@v4
        with:
          name: godan-hindi-female-20min
          path: |
            tools/audio-engine/demo/godan_20min_hi_female.mp3
            tools/audio-engine/demo/godan_duration.txt
          if-no-files-found: error
          retention-days: 7
