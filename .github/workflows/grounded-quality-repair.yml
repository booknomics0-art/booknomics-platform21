name: Grounded Book Quality Repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pilot or batch"
        required: true
        default: "pilot"
        type: choice
        options: [pilot, batch]
      limit:
        description: "Maximum books for batch mode"
        required: false
        default: "20"
      apply:
        description: "Write only quality-gate-passing books as published"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: grounded-book-quality-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      SUPABASE_URL: https://pbkfewrtdgiagytmcigb.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROUNDED_REPAIR_MODEL: gemini-3.8-flash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify repair credentials are configured
        shell: bash
        run: |
          missing=0
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY repository secret"
            missing=1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Missing GEMINI_API_KEY repository secret"
            missing=1
          fi
          exit "$missing"

      - name: Run source-grounded pilot or batch
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode }}"
          LIMIT="${{ github.event.inputs.limit }}"
          APPLY="${{ github.event.inputs.apply }}"
          if [ -z "$MODE" ]; then MODE="pilot"; fi
          if [ -z "$LIMIT" ]; then LIMIT="4"; fi
          ARGS="--limit=$LIMIT"
          if [ "$MODE" = "pilot" ]; then ARGS="$ARGS --pilot"; fi
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          node scripts/grounded-quality-repair.mjs $ARGS
