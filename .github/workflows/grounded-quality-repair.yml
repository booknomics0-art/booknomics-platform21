name: Grounded Book Quality Repair

on:
  push:
    branches: [main]
    paths:
      - "scripts/grounded-quality-repair.mjs"
      - ".github/workflows/grounded-quality-repair.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "pilot or batch"
        required: true
        default: "pilot"
        type: choice
        options: [pilot, batch]
      limit:
        description: "Maximum books for batch mode"
        required: false
        default: "20"
      apply:
        description: "Write only quality-gate-passing books as published"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: grounded-book-quality-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing VERCEL_TOKEN repository secret"
            exit 1
          fi

      - name: Pull production environment securely
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install --global vercel@latest
          vercel link --yes --project booknomics-platform21 --scope shivam-4d29 --token "$VERCEL_TOKEN"
          vercel env pull .env.production.local --environment=production --yes --token "$VERCEL_TOKEN"

      - name: Run source-grounded pilot or batch
        shell: bash
        run: |
          set -a
          source .env.production.local
          set +a
          MODE="${{ github.event.inputs.mode }}"
          LIMIT="${{ github.event.inputs.limit }}"
          APPLY="${{ github.event.inputs.apply }}"
          if [ -z "$MODE" ]; then MODE="pilot"; fi
          if [ -z "$LIMIT" ]; then LIMIT="4"; fi
          ARGS="--limit=$LIMIT"
          if [ "$MODE" = "pilot" ]; then ARGS="$ARGS --pilot"; fi
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          node scripts/grounded-quality-repair.mjs $ARGS
