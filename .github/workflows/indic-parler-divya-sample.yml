name: Generate AI4Bharat Divya Hindi Samples

on:
  push:
    branches:
      - feature/indic-parler-divya-sample
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight HTTP tools
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Generate Divya Hindi samples via raw Gradio queue API
        run: |
          mkdir -p divya_samples
          python - <<'PY'
          import json
          import os
          import time
          import requests
          from urllib.parse import urljoin

          BASE = "https://ai4bharat-indic-parler-tts.hf.space/"
          text = '''नमस्कार। आप सुन रहे हैं बुकनॉमिक्स पर प्रेमचंद के महान उपन्यास गोदान का सार। होरी एक साधारण किसान है, जिसकी सबसे बड़ी इच्छा है कि उसके घर एक गाय हो। यह छोटी-सी इच्छा धीरे-धीरे कर्ज़, सामाजिक दबाव, परिवार की जिम्मेदारियों और गांव की कठोर व्यवस्था से जुड़ जाती है। गोदान केवल एक किसान की कहानी नहीं, बल्कि उस समाज का चित्र है जहाँ मेहनत करने वाला व्यक्ति भी सम्मान और सुरक्षा के लिए संघर्ष करता रहता है।'''

          styles = {
              '01_warm_audiobook': "Divya speaks in natural native Hindi with a warm, calm, mature female audiobook voice. She narrates expressively but not dramatically, at a moderate conversational pace, with clear Hindi pronunciation, natural pauses, gentle sentence endings, and a very high-quality close studio recording with no background noise.",
              '02_calm_storytelling': "Divya speaks in natural native Hindi with a soft, warm and emotionally engaging female storytelling voice. Her pace is relaxed and smooth, pronunciation is very clear, pauses feel human and natural, and the recording is close, clean and studio quality with no background noise.",
              '03_professional': "Divya speaks in natural native Hindi with a confident, clear, professional female narration voice. She uses a moderate pace, precise pronunciation, subtle expression, natural breathing and pauses, and a high-quality close studio recording with no background noise. The delivery should sound human, polished and suitable for a premium audiobook.",
          }

          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 BooknomicsAudioTest/1.0"})

          def post_job(payload):
              candidates = [
                  "gradio_api/call/generate_jenny",
                  "call/generate_jenny",
              ]
              errors = []
              for endpoint in candidates:
                  url = urljoin(BASE, endpoint)
                  r = session.post(url, json={"data": payload}, timeout=60)
                  print("POST", url, r.status_code, r.text[:500], flush=True)
                  if r.ok:
                      data = r.json()
                      if data.get("event_id"):
                          return endpoint, data["event_id"]
                  errors.append((url, r.status_code, r.text[:500]))
              raise RuntimeError(f"Could not create Gradio job: {errors}")

          def stream_result(endpoint, event_id):
              url = urljoin(BASE, f"{endpoint}/{event_id}")
              r = session.get(url, stream=True, timeout=(30, 900))
              print("GET", url, r.status_code, flush=True)
              r.raise_for_status()
              event = None
              last_data = None
              for raw in r.iter_lines(decode_unicode=True):
                  if raw is None:
                      continue
                  line = raw.strip()
                  if not line:
                      continue
                  print("SSE", line[:1000], flush=True)
                  if line.startswith("event:"):
                      event = line.split(":", 1)[1].strip()
                  elif line.startswith("data:"):
                      body = line.split(":", 1)[1].strip()
                      try:
                          last_data = json.loads(body)
                      except Exception:
                          last_data = body
                      if event == "error":
                          raise RuntimeError(f"Remote generation error: {last_data}")
                      if event == "complete":
                          return last_data
              return last_data

          def find_audio(value):
              if isinstance(value, dict):
                  for key in ("url", "path"):
                      v = value.get(key)
                      if isinstance(v, str) and v:
                          if v.startswith("http") or ".mp3" in v or "/tmp/" in v:
                              return v
                  for v in value.values():
                      found = find_audio(v)
                      if found:
                          return found
              elif isinstance(value, (list, tuple)):
                  for v in value:
                      found = find_audio(v)
                      if found:
                          return found
              elif isinstance(value, str):
                  if value.startswith("http") or ".mp3" in value:
                      return value
              return None

          def download_audio(ref, dst):
              urls = []
              if ref.startswith("http"):
                  urls.append(ref)
              else:
                  urls.extend([
                      urljoin(BASE, f"gradio_api/file={ref}"),
                      urljoin(BASE, f"file={ref}"),
                  ])
              for url in urls:
                  rr = session.get(url, timeout=120)
                  print("AUDIO GET", url, rr.status_code, rr.headers.get("content-type"), len(rr.content), flush=True)
                  if rr.ok and len(rr.content) > 1000:
                      with open(dst, "wb") as f:
                          f.write(rr.content)
                      return
              raise RuntimeError(f"Could not download audio ref {ref!r}")

          for name, description in styles.items():
              print(f"Generating {name}...", flush=True)
              endpoint, event_id = post_job([text, description, 3.0])
              result = stream_result(endpoint, event_id)
              print("FINAL", repr(result), flush=True)
              ref = find_audio(result)
              if not ref:
                  raise RuntimeError(f"No audio reference found in result: {result!r}")
              dst = f"divya_samples/{name}.mp3"
              download_audio(ref, dst)
              print("Saved", dst, os.path.getsize(dst), flush=True)
              time.sleep(1)
          PY
      - name: Inspect outputs
        run: |
          ls -lh divya_samples
          for f in divya_samples/*.mp3; do
            ffprobe -v error -show_entries format=duration,bit_rate -of default=noprint_wrappers=1 "$f" || true
          done
      - name: Upload samples
        uses: actions/upload-artifact@v4
        with:
          name: ai4bharat-divya-hindi-samples
          path: divya_samples/*.mp3
          retention-days: 7
