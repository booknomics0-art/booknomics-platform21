name: One-time canonical alias redirect sync

on:
  push:
    branches:
      - fix/google-ranking-render-stability-20261008

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/google-ranking-render-stability-20261008
          fetch-depth: 0

      - name: Reconcile hosting redirects
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'vercel.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const canonical = {
            '/books/cant-hurt-me': '/books/can-t-hurt-me-david-goggins-summary',
            '/books/can_t_hurt_me': '/books/can-t-hurt-me-david-goggins-summary',
            '/books/mans-search-for-meaning': '/books/man-s-search-for-meaning-viktor-e-frankl-summary',
            '/books/man-s-search-for-meaning': '/books/man-s-search-for-meaning-viktor-e-frankl-summary',
            '/books/mans-search-meaning': '/books/man-s-search-for-meaning-viktor-e-frankl-summary',
            '/books/7-habits': '/books/the-7-habits-of-highly-effective-people-stephen-r-covey-summary',
            '/books/7-habits-of-highly-effective-people': '/books/the-7-habits-of-highly-effective-people-stephen-r-covey-summary',
            '/books/seven-habits': '/books/the-7-habits-of-highly-effective-people-stephen-r-covey-summary',
            '/books/the-intelligent-investor': '/books/the-intelligent-investor-benjamin-graham-summary',
            '/books/intelligent-investor': '/books/the-intelligent-investor-benjamin-graham-summary',
            '/books/the-mountain-is-you': '/books/the-mountain-is-you-brianna-wiest-summary',
            '/books/mountain-is-you': '/books/the-mountain-is-you-brianna-wiest-summary',
            '/books/atomic-habit': '/books/atomic-habits-james-clear-summary',
            '/books/atomichabits': '/books/atomic-habits-james-clear-summary',
            '/books/wings-of-fire-apj': '/books/wings-of-fire-a-p-j-abdul-kalam-summary'
          };
          const remove = new Set([
            '/books/bhagavad-gita-hindi',
            '/books/bhagwad-gita',
            '/books/bhagwat-gita',
            '/books/chanakya-neeti',
            '/books/the-bhagavad-gita',
            '/books/gandhi-autobiography',
            '/books/my-experiments-with-truth',
            '/books/power-of-subconscious-mind',
            '/books/power-of-your-subconscious-mind',
            '/books/the-power-of-your-subconscious-mind'
          ]);

          const existing = Array.isArray(config.redirects) ? config.redirects : [];
          const untouched = existing.filter((r) => !remove.has(r.source) && !(r.source in canonical));
          const synced = Object.entries(canonical).map(([source, destination]) => ({ source, destination, permanent: true }));
          config.redirects = [...untouched, ...synced];
          fs.writeFileSync(path, JSON.stringify(config));
          NODE

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/sync-canonical-alias-redirects-once.yml
          git config user.name 'booknomics-seo-bot'
          git config user.email 'booknomics0@gmail.com'
          git add vercel.json .github/workflows/sync-canonical-alias-redirects-once.yml
          if git diff --cached --quiet; then
            echo 'No redirect changes required.'
            exit 0
          fi
          git commit -m 'Sync canonical alias redirects with current catalog'
          git push origin HEAD:fix/google-ranking-render-stability-20261008
