name: Generate Godan ElevenLabs Demo

on:
  push:
    branches:
      - feature/local-audio-engine
    paths:
      - 'tools/audio-engine/demo/generate_godan_elevenlabs.py'
      - 'tools/audio-engine/demo/godan_20min_hi.txt'
      - '.github/workflows/godan-elevenlabs-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install requests
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate ElevenLabs Hindi female MP3
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python tools/audio-engine/demo/generate_godan_elevenlabs.py
      - name: Show duration
        run: cat tools/audio-engine/demo/godan_elevenlabs_duration.txt
      - name: Upload demo audio
        uses: actions/upload-artifact@v4
        with:
          name: godan-elevenlabs-female-20min
          path: |
            tools/audio-engine/demo/godan_20min_hi_elevenlabs.mp3
            tools/audio-engine/demo/godan_elevenlabs_duration.txt
          if-no-files-found: error
          retention-days: 7
