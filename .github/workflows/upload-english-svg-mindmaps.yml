name: Upload English SVG mind maps to Supabase

on:
  workflow_dispatch:
  push:
    branches:
      - arena/7ad1337e-booknomics-platform21
    paths:
      - .github/workflows/upload-english-svg-mindmaps.yml

permissions:
  contents: read

concurrency:
  group: upload-english-svg-mindmaps-serial
  cancel-in-progress: true

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "English mindmap coverage is complete; stopping worker lane."
          echo "Existing Supabase mindmap assets remain untouched."
