name: Upload English SVG mind maps to Supabase

on:
  workflow_dispatch:
  push:
    branches:
      - arena/7ad1337e-booknomics-platform21
    paths:
      - .github/workflows/upload-english-svg-mindmaps.yml

permissions:
  contents: read

concurrency:
  group: upload-english-svg-mindmaps-v2
  cancel-in-progress: true

jobs:
  quiesce:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "English mindmap workers quiesced for serial database-safe completion."
          echo "Existing Supabase assets and book_assets rows are untouched."
