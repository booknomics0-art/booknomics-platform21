name: Upload English SVG mind maps to Supabase

on:
  workflow_dispatch:
  push:
    branches:
      - arena/7ad1337e-booknomics-platform21
    paths:
      - .github/workflows/upload-english-svg-mindmaps.yml

permissions:
  contents: read

concurrency:
  group: upload-english-svg-mindmaps-serial
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: https://pbkfewrtdgiagytmcigb.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve Supabase service key
        env:
          K1: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          K2: ${{ secrets.SUPABASE_SECRET_KEY }}
          K3: ${{ secrets.SUPABASE_SERVICE_KEY }}
          K4: ${{ secrets.SERVICE_ROLE_KEY }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          KEY="${K1:-${K2:-${K3:-$K4}}}"
          if [ -z "$KEY" ] && [ -n "$ACCESS_TOKEN" ]; then
            KEY=$(curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/pbkfewrtdgiagytmcigb/api-keys?reveal=true" \
              | python3 -c 'import json,sys; a=json.load(sys.stdin); k=next((x for x in a if x.get("name")=="service_role" or x.get("type")=="secret"), None); sys.stdout.write((k or {}).get("api_key") or "")') || KEY=""
          fi
          test -n "$KEY" || { echo "::error::No Supabase service-role/secret key available"; exit 1; }
          echo "::add-mask::$KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Validate scripts
        working-directory: tools/mindmap-engine
        run: python -m py_compile fetch_live_books.py render_svg.py generate_svg.py upload_svg_supabase.py upload_supabase.py content.py

      - name: Fetch tiny catalog once
        working-directory: tools/mindmap-engine
        run: python fetch_live_books.py --lang en --out ../../out/live-english-books.json --page 100

      - name: Smoke render English maps
        working-directory: tools/mindmap-engine
        run: python generate_svg.py --lang en --json ../../out/live-english-books.json --out ../../out/svg-en-smoke --limit 5

      - name: Render English SVG maps
        working-directory: tools/mindmap-engine
        run: python generate_svg.py --lang en --json ../../out/live-english-books.json --out ../../out/mindmaps-en-svg

      - name: Enforce count and size guards
        run: |
          bytes=$(du -sb out/mindmaps-en-svg | cut -f1)
          count=$(find out/mindmaps-en-svg -maxdepth 1 -name '*.svg' | wc -l)
          echo "Rendered $count English SVGs using $bytes bytes"
          test "$count" -ge 3400 || { echo "::error::Expected >=3400 English SVGs"; exit 1; }
          test "$bytes" -le 104857600 || { echo "::error::English SVG batch exceeds 100 MB safety ceiling"; exit 1; }

      - name: Upload only missing English mindmaps
        working-directory: tools/mindmap-engine
        run: python upload_svg_supabase.py --lang en --dir ../../out/mindmaps-en-svg --catalog-json ../../out/live-english-books.json --workers 2
