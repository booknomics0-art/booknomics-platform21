name: Patch public prerender routing

on:
  push:
    branches:
      - fix/public-authority-prerender-20261007
    paths:
      - .github/workflows/patch-public-prerender-routing.yml

permissions:
  contents: write

jobs:
  patch-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-authority-prerender-20261007
          fetch-depth: 0

      - name: Let physical prerender files own public routes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'vercel.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const physical = new Set([
            '/about', '/contact', '/press', '/resources',
            '/resources/7-day-reading-action-tracker',
            '/resources/book-summary-template',
            '/resources/best-book-summary-websites',
            '/resources/best-hindi-book-summaries-guide',
            '/privacy', '/terms', '/blog', '/blog/(.*)', '/privacy-policy'
          ]);
          config.rewrites = (config.rewrites || []).filter(r => !physical.has(r.source));
          config.redirects = Array.isArray(config.redirects) ? config.redirects : [];
          if (!config.redirects.some(r => r.source === '/privacy-policy')) {
            config.redirects.unshift({ source: '/privacy-policy', destination: '/privacy', permanent: true });
          }
          fs.writeFileSync(path, JSON.stringify(config));
          NODE

      - name: Commit routing patch
        run: |
          if git diff --quiet -- vercel.json; then
            echo "No routing changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel.json
          git commit -m "fix(seo): serve public prerender files directly"
          git push origin HEAD:fix/public-authority-prerender-20261007
