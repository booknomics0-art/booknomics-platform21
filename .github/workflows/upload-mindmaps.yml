name: Legacy PNG mind maps (superseded)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/7ad1337e-booknomics-platform21
    paths:
      - .github/workflows/upload-mindmaps.yml

permissions:
  contents: read

# The old sequential PNG run consumes far more storage/DB bandwidth. A push to
# this file intentionally cancels any in-flight legacy PNG run. Existing PNGs
# stay untouched; missing maps are completed by the localized SVG workflows.
concurrency:
  group: upload-mindmaps
  cancel-in-progress: true

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Legacy sequential PNG publisher is superseded."
          echo "Existing PNG mindmaps remain in Supabase."
          echo "Use Upload Hindi SVG mind maps to Supabase / Upload English SVG mind maps to Supabase for missing-only completion."
