name: Upload mind maps to Supabase
# Manual, production-scoped workflow. Uses only the dedicated repository
# secret SUPABASE_SERVICE_ROLE_KEY; no management-token fallback is allowed.

on:
  workflow_dispatch:
    inputs:
      lang:
        description: Which maps to generate and upload
        required: true
        default: hi
        type: choice
        options:
          - hi
          - en
          - both
      force:
        description: Replace mindmap_url even when a map is already stored
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: upload-mindmaps
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      SUPABASE_URL: https://pbkfewrtdgiagytmcigb.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify Supabase service credential
        shell: bash
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY repository secret"
            exit 1
          fi
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"

      - name: Install renderer
        run: pip install -r tools/mindmap-engine/requirements.txt

      - name: Fetch exact published Hindi books from production
        if: ${{ inputs.lang == 'hi' || inputs.lang == 'both' }}
        shell: bash
        run: |
          mkdir -p out
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          fields = ",".join([
              "id", "slug", "title", "author", "category", "tagline", "overview",
              "key_ideas", "deep_summary", "deep_analysis", "daily_application",
              "action_system", "real_life_example", "language"
          ])
          rows = []
          start = 0
          page = 500
          while True:
              query = urllib.parse.urlencode({
                  "select": fields,
                  "language": "eq.hi",
                  "status": "eq.published",
                  "is_draft": "eq.false",
                  "order": "slug.asc",
              })
              req = urllib.request.Request(
                  f"{base}/rest/v1/books?{query}",
                  headers={
                      "apikey": key,
                      "Authorization": f"Bearer {key}",
                      "Range": f"{start}-{start + page - 1}",
                      "Prefer": "count=exact",
                  },
              )
              with urllib.request.urlopen(req, timeout=120) as resp:
                  batch = json.loads(resp.read().decode("utf-8") or "[]")
              rows.extend(batch)
              if len(batch) < page:
                  break
              start += page

          if not rows:
              raise SystemExit("No published Hindi books returned from production")
          for row in rows:
              row["lang"] = "hi"
          Path("out/live-hindi-books.json").write_text(
              json.dumps(rows, ensure_ascii=False), encoding="utf-8"
          )
          print(f"Fetched {len(rows)} published Hindi books with exact production slugs")
          PY

      - name: Render Hindi maps from live content
        if: ${{ inputs.lang == 'hi' || inputs.lang == 'both' }}
        run: python generate.py --lang hi --json ../../out/live-hindi-books.json --out ../../out/mindmaps-hi-live --manifest
        working-directory: tools/mindmap-engine

      - name: Render English maps
        if: ${{ inputs.lang == 'en' || inputs.lang == 'both' }}
        run: python generate.py --lang en --out ../../out/mindmaps --skip-existing
        working-directory: tools/mindmap-engine

      - name: Upload to book_assets
        shell: bash
        run: |
          lang="${{ inputs.lang }}"
          extra=""
          if [ "${{ inputs.force }}" = "true" ]; then extra="--force"; fi
          if [ "$lang" = "hi" ]; then
            python upload_supabase.py --lang hi --dir ../../out/mindmaps-hi-live $extra
          elif [ "$lang" = "en" ]; then
            python upload_supabase.py --lang en --dir ../../out/mindmaps $extra
          else
            python upload_supabase.py --lang hi --dir ../../out/mindmaps-hi-live $extra
            python upload_supabase.py --lang en --dir ../../out/mindmaps $extra
          fi
        working-directory: tools/mindmap-engine
