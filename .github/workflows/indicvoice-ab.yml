name: Generate Native Hindi Female A/B

on:
  push:
    branches:
      - feature/indicvoice-ab
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng libespeak-ng1 espeak-ng-data ffmpeg curl
      - name: Install IndicVoice CPU-only
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install git+https://github.com/Bindkushal/indic-g2p.git
          pip install git+https://github.com/Bindkushal/indic-voice.git
          pip install soundfile spacy
      - name: Download real Hindi female voice packs
        run: |
          mkdir -p voicepacks
          curl -fL --retry 3 'https://huggingface.co/Bindkushal/IndicVoice-82M/resolve/main/voices/hf_alpha.pt?download=true' -o voicepacks/hf_alpha.pt
          curl -fL --retry 3 'https://huggingface.co/Bindkushal/IndicVoice-82M/resolve/main/voices/hf_beta.pt?download=true' -o voicepacks/hf_beta.pt
          ls -lh voicepacks
          python - <<'PY'
          from pathlib import Path
          for p in [Path('voicepacks/hf_alpha.pt'), Path('voicepacks/hf_beta.pt')]:
              b = p.read_bytes()[:32]
              print(p, p.stat().st_size, b)
              if b.startswith(b'version https://git-lfs'):
                  raise SystemExit(f'{p} is still an LFS pointer, not the real voice pack')
          PY
      - name: Patch trusted voice-pack loader for PyTorch 2.6
        run: |
          python - <<'PY'
          import pathlib
          import indicvoice.pipeline as pipeline
          path = pathlib.Path(pipeline.__file__)
          text = path.read_text(encoding='utf-8')
          text = text.replace('torch.load(f, weights_only=True)', 'torch.load(f, weights_only=False)')
          path.write_text(text, encoding='utf-8')
          print('Patched:', path)
          PY
      - name: Generate native Hindi female samples
        run: |
          mkdir -p indicvoice_samples
          python - <<'PY'
          import glob
          import numpy as np
          import soundfile as sf
          import indicg2p.espeak
          from phonemizer.backend.espeak.wrapper import EspeakWrapper

          candidates = glob.glob('/usr/lib/x86_64-linux-gnu/libespeak-ng.so*') + glob.glob('/usr/lib/*/libespeak-ng.so*')
          if not candidates:
              raise RuntimeError('system libespeak-ng not found')
          EspeakWrapper.set_library(sorted(candidates, key=len)[0])

          from indicvoice import IndicPipeline
          text = '''नमस्कार। आप सुन रहे हैं बुकनॉमिक्स पर प्रेमचंद के उपन्यास गोदान का सार। होरी एक साधारण किसान है, जिसकी सबसे बड़ी इच्छा है कि उसके घर एक गाय हो। लेकिन यही छोटी-सी इच्छा कर्ज़, सामाजिक दबाव और परिवार की जिम्मेदारियों से जुड़कर उसके जीवन को कठिन बना देती है।'''
          pipeline = IndicPipeline(lang_code='hi', repo_id='Bindkushal/IndicVoice-82M')

          for name in ['hf_alpha', 'hf_beta']:
              voice = f'voicepacks/{name}.pt'
              pieces = [audio for _, _, audio in pipeline(text, voice=voice)]
              wav = np.concatenate(pieces) if pieces else np.zeros(24000, dtype='float32')
              sf.write(f'indicvoice_samples/{name}.wav', wav, 24000)
              print(name, 'duration=', len(wav)/24000)
          PY
      - name: Master and inspect samples
        run: |
          for f in indicvoice_samples/*.wav; do
            out="${f%.wav}.mp3"
            ffmpeg -hide_banner -loglevel error -y -i "$f" -af "loudnorm=I=-16:LRA=7:TP=-1.5" -ar 48000 -ac 1 -c:a libmp3lame -b:a 96k "$out"
            ffprobe -v error -show_entries format=duration,bit_rate -of default=noprint_wrappers=1 "$out"
          done
      - name: Upload samples
        uses: actions/upload-artifact@v4
        with:
          name: native-hindi-female-ab
          path: indicvoice_samples/*.mp3
          retention-days: 7
