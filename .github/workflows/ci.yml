name: Validate Booknomics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cutover-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce browser Supabase cutover guard
        run: node scripts/guard-no-browser-supabase.mjs

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Validate AEO/GEO prerender scripts
        run: |
          node --check scripts/prerender-aeo-geo.mjs
          node --check scripts/guard-aeo-prerender.mjs
      - name: Validate Cloudflare migration safety scripts
        run: |
          node --check cloudflare/apply-d1-sql.mjs
          node --check cloudflare/migrate.mjs
          node --check cloudflare/migrate-storage.mjs
          node --check cloudflare/verify-storage.mjs
          node --check cloudflare/sync-referrals.mjs
          node --check cloudflare/sync-book-modules.mjs
          node --check cloudflare/verify-parity.mjs
          node --check scripts/guard-no-browser-supabase.mjs
      - name: Build app without live-data lifecycle hooks
        run: npm run build --ignore-scripts
        env:
          VITE_SUPABASE_URL: https://ci-preview.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          ALLOW_STATIC_SITEMAP: 'true'
      - name: Validate Wrangler config and Worker bundle
        run: npx --yes wrangler@4.136.3 deploy --dry-run --outdir /tmp/booknomics-wrangler-dry-run
