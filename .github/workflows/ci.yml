name: Validate Booknomics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cutover-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce browser Supabase cutover guard
        run: node scripts/guard-no-browser-supabase.mjs

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Validate AEO/GEO prerender scripts
        run: |
          node --check scripts/prerender-aeo-geo.mjs
          node --check scripts/guard-aeo-prerender.mjs
      - name: Validate Cloudflare migration safety scripts
        run: |
          node --check cloudflare/apply-d1-sql.mjs
          node --check cloudflare/migrate.mjs
          node --check cloudflare/migrate-storage.mjs
          node --check cloudflare/verify-storage.mjs
          node --check cloudflare/sync-referrals.mjs
          node --check cloudflare/sync-book-modules.mjs
          node --check cloudflare/verify-parity.mjs
          node --check scripts/guard-no-browser-supabase.mjs
      - name: Build app without Supabase browser configuration
        run: npm run build --ignore-scripts
        env:
          ALLOW_STATIC_SITEMAP: 'true'
      - name: Enforce Supabase-free browser bundle
        shell: bash
        run: |
          set -euo pipefail
          if find dist/assets -maxdepth 1 -type f -name 'supabase-*.js' | grep -q .; then
            echo 'Unexpected Supabase vendor chunk found in dist/assets.' >&2
            find dist/assets -maxdepth 1 -type f -name 'supabase-*.js' -print >&2
            exit 1
          fi
          if grep -RIlE 'pbkfewrtdgiagytmcigb\.supabase\.co|ci-preview\.supabase\.co' dist/assets --include='*.js' | grep -q .; then
            echo 'Supabase project host leaked into production JavaScript bundle.' >&2
            grep -RIlE 'pbkfewrtdgiagytmcigb\.supabase\.co|ci-preview\.supabase\.co' dist/assets --include='*.js' >&2
            exit 1
          fi
          echo 'Production browser bundle is Supabase-free.'
      - name: Validate Wrangler config and Worker bundle
        run: npx --yes wrangler@4.136.3 deploy --dry-run --outdir /tmp/booknomics-wrangler-dry-run
